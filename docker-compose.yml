# Production stack: backend (FastAPI+Playwright), frontend (Next.js standalone),
# Caddy (reverse proxy + automatic HTTPS). Bring up with:  docker compose up -d
services:
  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin: the browser calls "/api/..." and Caddy routes it
        # to the backend, so no separate API host or CORS is needed.
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: ./backend/.env  # provides DOMAIN for the Caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # persisted TLS certificates
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
