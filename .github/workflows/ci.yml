name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Dummy values so `Settings()` loads at import time. The unit tests mock the
    # database and LLM providers, so no real credentials are needed.
    env:
      SUPABASE_URL: http://localhost
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
      GEMINI_API_KEY: ci-dummy
      GROQ_API_KEY: ci-dummy
      APP_AUTH_SECRET: ci-dummy-secret-ci-dummy-secret
      APP_JWT_SIGNING_KEY: ci-dummy-signing-ci-dummy-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install .
          pip install pytest pytest-asyncio ruff
      - name: Lint (ruff)
        run: ruff check app/
      - name: Unit tests
        run: python -m pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: ""
